# GridBook standalone deployment example.
# Use this as a dedicated server block or subdomain and add the appropriate
# TLS directives for the host environment.
server {
    listen 80;
    server_name gridbook.example.com;

    root /opt/gridbook/web;
    index index.html;
    client_max_body_size 20m;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8767/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        proxy_connect_timeout 5s;
        add_header X-Accel-Buffering no always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }
}
